---
Name: youwilllikeit-egov-security
After:
  - '#coresecurity'
---
# Email one-time code (second login step) for /admin, /egov-datoteke, /egov-izvjestaji.
# Runs after AuthenticationMiddleware so the current member is known.
SilverStripe\Core\Injector\Injector:
  SilverStripe\Control\Director:
    properties:
      Middlewares:
        EGovEmailOtpMiddleware: '%$YouWillLikeIT\EGov\Security\EmailOtpMiddleware'

SilverStripe\Security\Member:
  extensions:
    - YouWillLikeIT\EGov\Security\EGovMemberExtension
  # Account lock-out after repeated wrong passwords (core feature)
  lock_out_after_incorrect_logins: 5
  lock_out_delay_mins: 15

YouWillLikeIT\EGov\Security\EmailOtpService:
  enabled: true
  code_ttl_minutes: 10
  resend_cooldown_seconds: 60
  max_attempts: 5
  protected_prefixes: [admin, egov-datoteke, egov-izvjestaji]
  exempt_permission: ''

# Automatic logout after inactivity (seconds)
SilverStripe\Control\Session:
  timeout: 3600
